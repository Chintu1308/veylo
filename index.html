<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Veylo - Verify Every Layer | Zero Trust Cloud Security</title>
    <meta name="description" content="Veylo is a multi-tenant adaptive Zero Trust cloud security platform. Continuously verify organization, identity, device, network, behaviour, and resources." />
    <meta name="theme-color" content="#1A7C74" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/veylo.png" />

    <!-- Google Fonts: Manrope (UI) + JetBrains Mono (data surfaces) -->
    <!-- Loaded via CSS @import in index.css; this preconnect speeds up the connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function() {
        const saved = localStorage.getItem("veylo-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = saved ? saved === "dark" : prefersDark;
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.setProperty("--color-bg", "#03020b");
          document.documentElement.style.setProperty("--color-fg", "#fcfcfd");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.setProperty("--color-bg", "#fdfdfc");
          document.documentElement.style.setProperty("--color-fg", "#09090b");
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-C7gG1fmE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DELFeqO8.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
